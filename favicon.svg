<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.8 -3.8 7.6 7.6">
  <!-- The logo for tab bars: three dots balancing on a slightly tipped line. -->
  <style>
    .l { fill: #181818; } .a { fill: #4F1411; } .b { fill: #14384C; } .c { fill: #665951; }
    @media (prefers-color-scheme: dark) {
      .l { fill: #E1D9D0; } .a { fill: #D4958A; } .b { fill: #8FB3C9; } .c { fill: #B5A99F; }
    }
  </style>
  <g transform="translate(0 0.9) rotate(-6)">
    <rect class="l" x="-3.5" y="0" width="7" height=".55" rx=".275"/>
    <circle class="a" cx="-2.25" cy="-.78" r=".78"/>
    <circle class="b" cx="0" cy="-.78" r=".78"/>
    <circle class="c" cx="2.25" cy="-.78" r=".78"/>
  </g>
</svg>
