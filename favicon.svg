<svg xmlns="http://www.w3.org/2000/svg" viewBox="-262 -336 524 524">
  <!-- The logo, filling the icon. Charcoal turns cream in dark tab bars. -->
  <style>
    path { fill-opacity: .88; mix-blend-mode: multiply; }
    .t { fill: #A0452E; } .s { fill: #86A8D2; } .c { fill: #3A3538; }
    @media (prefers-color-scheme: dark) {
      path { fill-opacity: .92; mix-blend-mode: screen; }
      .t { fill: #D9785E; } .c { fill: #F3ECE5; }
    }
  </style>
  <g style="isolation: isolate">
    <path class="t" d="M 0 -295 A 238.24 238.24 0 0 1 0 100 A 238.24 238.24 0 0 1 0 -295 Z"/>
    <path class="s" d="M 0 -295 A 238.24 238.24 0 0 1 0 100 A 238.24 238.24 0 0 1 0 -295 Z" transform="rotate(120)"/>
    <path class="c" d="M 0 -295 A 238.24 238.24 0 0 1 0 100 A 238.24 238.24 0 0 1 0 -295 Z" transform="rotate(240)"/>
  </g>
</svg>
