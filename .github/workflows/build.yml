# Rebuilds index.html whenever content.md, the template or the build script changes,
# commits the result to main, and asks GitHub Pages to publish it.
name: Build site from content.md

on:
  push:
    branches: [main]
    paths: [content.md, template.html, build.py]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html
        run: python3 build.py

      - name: Commit index.html if it changed
        id: commit
        run: |
          if git diff --quiet index.html; then
            echo "index.html is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild index.html from content.md"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by this workflow do not always start a Pages build on their own.
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
