# Rebuilds index.html and the link-preview image (assets/img/share.jpg) whenever content.md,
# the templates or the build scripts change, commits the result to main, and asks GitHub Pages to publish it.
name: Build site from content.md

on:
  push:
    branches: [main]
    paths: [content.md, template.html, build.py, share-template.html, render_share.py, assets/img/photos/towers-1800.webp]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html and share.html
        run: python3 build.py

      - name: Install the browser that renders the share image
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Render assets/img/share.jpg
        run: python3 render_share.py

      - name: Commit index.html and share.jpg if they changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- index.html assets/img/share.jpg)" ]; then
            echo "index.html and share.jpg are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets/img/share.jpg
            git commit -m "Rebuild index.html and share image from content.md"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by this workflow do not always start a Pages build on their own.
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
